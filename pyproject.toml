[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "jarvis"
version = "1.2.0"
description = "J.A.R.V.I.S. — Just A Rather Very Intelligent System. Personal AI assistant powered by NVIDIA."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "fastapi>=0.109.0",
    "httpx[socks]>=0.27.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "markdown>=3.6",
    "numpy>=1.26.0,<2.5",
    "openai>=1.30.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.0",
    "pygments>=2.17.0",
    "python-pptx>=0.6.23",
    "python-telegram-bot>=21.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "SpeechRecognition>=3.10.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
voice = ["PyAudio>=0.2.14"]
dev = [
    "build>=1.2.2",
    "mypy>=1.11.0,<2.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-Markdown>=3.6.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
nexus = "jarvis.cli:main"
amaura-worker = "jarvis.amaura.supervisor:main"
amaura = "jarvis.amaura.cli:main"


[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.amaura.prompts" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
